hydra:
  run:
    dir: .

# Root of the Pansori corpus (audio + fold-split index files). Lives OUTSIDE
# this repo; the corpus is not distributed with the code.
#   export PANSORI_DATA_ROOT=/path/to/Pansori_Data
paths:
  data_root: ${oc.env:PANSORI_DATA_ROOT,../Pansori_Data}

# Data sources
data:
  data_dir: "${paths.data_root}/Audio_Original"
  label_dir: "data/Label"


# Dataset configuration
dataset:
  name: "CMERTFrameDataset"
  params:
    num_classes: 5
    sr: 24000
    channels: 'mono'
    window: 30

    aug: True
    # is_valid: False

# Model
model:
  name: "CMERTClassifier"
  # name: "CMERTConv1DEnc"
  # name: "CMERTConv1DGRU"
  params:
    layer_index: 12   # which MERT transformer layer to read features from (1..12)
    embed_dims: 512
    num_classes: ${dataset.params.num_classes}

    num_layers: 3
    in_channels: 768

    last_hidden_dim: 128
    use_gradual_size: False

    kernel_size: 3
    pool_size: False
    dilation: 1
    cnn_dropout: 0.25

    num_gru: 3
    hidden_dim: 128
    dropout: 0.25


# Loss params
loss:
  name: FocalLoss # If alpha=1 gamma=0: FocalLoss -> CrossEntropyLoss
  params:
    gamma: 2.0
    ignore_index: 0
    weights:
    - 0.3
    - 3.0
    - 1.0
    - 1.5
    - 3.0

# Training parameters
train:
  trainer: "FrameTrainer"
  lr: 3e-4
  batch_size: 8
  num_iterations: 10000
  eval_interval: 200
  save_interval: 25000
  random_seed: 42
  num_workers: 8      # 8 keeps the GPU fed (data prep 400ms/batch vs 540ms GPU step)
  eval_batch_size: 4  # validation was batch 1 + 0 workers and took longer than training
  save_plots: False   # skip posteriorgram PNGs, confusion matrices, hard-train-segment pass
  auto_resume: True   # save/restore full training state so a killed run continues mid-fold
  selection: Version # KFold # Artist # Stratify
  shared_fold_dir: "${paths.data_root}/pansori_random_fold" # shared 10-fold split files
  song_stratified_dir: "${paths.data_root}/song_stratified"
  version_split_dir: "${paths.data_root}/pansori_version_split"
  k_folds: 10
  target_folds: null  # e.g. [1] or [1,2,3] to run only specific folds; null = run all


# Cross-validation parameters
kfold:
  n_splits: 5
  shuffle: True
  random_state: ${train.random_seed}


# Directory paths
dir:
  save_dir: "weights/cmert"