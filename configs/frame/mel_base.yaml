hydra:
  run:
    dir: .

# Data sources
data:
  data_dir: "/home/sangheon/Desktop/Pansori_Data/Audio"
  label_dir: "/home/sangheon/Desktop/PansoriModeChangeDetection/data/Label"

# Dataset configuration
dataset:
  name: "MelFrameDataset"
  params:
    num_classes: 5
    sr: 16000
    channels: 'mono'
    window: 30
    n_fft: 2048
    hop_length: 512
    target_bins: 40
    aug: True

# Model
model:
  name: "Conv2DGRU"
  params:
    num_layers: 3
    in_channels: 1
    num_bins: ${dataset.params.target_bins}

    last_hidden_dim: 64
    use_gradual_size: False

    kernel_size: 3
    pool_size: (2,1)
    dilation: (1,2)
    cnn_dropout: 0

    num_gru: 1
    hidden_dim: 64
    dropout: 0.3
    num_classes: 5

# Loss params
loss:
  name: FocalLoss # If alpha=1 gamma=0: FocalLoss -> CrossEntropyLoss
  params:
    alpha: 1
    gamma: 0.0
    ignore_index: 0

# Training parameters
train:
  trainer: "FrameTrainer"
  lr: 5e-4
  batch_size: 32
  num_iterations: 10000
  eval_interval: 200
  save_interval: 1000
  early_stopping_patience: 10
  random_seed: 42
  selection: KFold

# Cross-validation parameters
kfold:
  n_splits: 10
  shuffle: True
  random_state: ${train.random_seed}

stratify: "/home/sangheon/Desktop/PansoriModeChangeDetection/data/Stratify/stratify.csv"


# Directory paths
dir:
  save_dir: "weights/frame"