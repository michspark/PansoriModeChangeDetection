hydra:
  run:
    dir: .

# Root of the Pansori corpus (audio + fold-split index files). Lives OUTSIDE
# this repo; the corpus is not distributed with the code.
#   export PANSORI_DATA_ROOT=/path/to/Pansori_Data
paths:
  data_root: ${oc.env:PANSORI_DATA_ROOT,../Pansori_Data}

# Data sources
data:
  data_dir: "${paths.data_root}/crepe"
  label_dir: "data/Label"

# Dataset configuration
dataset:
  name: "PitchSegmentDataset"
  params:
    num_classes: 3
    frame_rate: 20
    window: 20
    threshold: 0.0
    aug: True

model:
  name: "SegConv1DGRU"
  params:
    num_layers: 3
    in_channels: 2

    last_hidden_dim: 128
    use_gradual_size: True

    kernel_size: 3
    pool_size: 2 # False
    dilation: 1
    cnn_dropout: 0.5

    num_gru: 5
    hidden_dim: 128
    dropout: 0

    num_frames : ${dataset.params.window}*${dataset.params.frame_rate}
    num_classes: ${dataset.params.num_classes}

# Loss params
# If alpha=1 gamma=0: FocalLoss -> CrossEntropyLoss
loss:
  name: FocalLoss
  params:
    alpha: 1
    gamma: 0
    ignore_index: -100

# Training parameters
train:
  trainer: "SegmentTrainer"
  lr: 5e-4
  batch_size: 32
  num_iterations: 5000
  eval_interval: 200
  save_interval: 1000
  random_seed: 42
  selection: Artist # SongStratified # KFold
  version_split_dir: "${paths.data_root}/pansori_version_split"

# Cross-validation parameters
kfold:
  n_splits: 5
  shuffle: True
  random_state: ${train.random_seed}

# Directory paths
dir:
  save_dir: "weights/artist"