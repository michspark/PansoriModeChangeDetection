hydra:
  run:
    dir: .

# Data sources
data:
  data_dir: "/home/sangheon/Desktop/Pansori_Data/Audio"
  label_dir: "/home/sangheon/Desktop/PansoriModeChangeDetection/data/Label"

# Dataset configuration
dataset:
  name: "MelSegmentDataset"
  params:
    num_classes: 3
    sr: 16000
    channels: 'mono'
    window: 20
    n_fft: 2048
    hop_length: 512
    target_bins: 80
    aug: True

# Model
model:
  name: "SegConv2DGRU"
  params:
    num_layers: 3
    in_channels: 1
    num_bins: ${dataset.params.target_bins}
    num_frames: (${dataset.params.window}*${dataset.params.sr}/${dataset.params.hop_length})

    last_hidden_dim: 128
    use_gradual_size: False

    kernel_size: 3
    pool_size: (2,1) # (2)
    dilation: (1,2)
    cnn_dropout: 0

    num_gru: 3
    hidden_dim: 128
    dropout: 0.3
    num_classes: 3

# Loss params
loss:
  name: FocalLoss # If alpha=1 gamma=0: FocalLoss -> CrossEntropyLoss
  params:
    alpha: 1
    gamma: 0.0
    ignore_index: -100

# Training parameters
train:
  trainer: "SegmentTrainer"
  lr: 5e-4
  batch_size: 32
  num_iterations: 5000
  eval_interval: 10
  save_interval: 1000
  random_seed: 42
  selection: SharedFold   # SongStratified | SharedFold | KFold | Artist | RandomSplit | Version
  fold_dir: "/home/sangheon/Desktop/pansori_folds"  # shared 10-fold split files
  k_folds: 10
  version_split_dir: "/home/sangheon/Desktop/Pansori_Data/pansori_version_split"

# Cross-validation parameters
kfold:
  n_splits: 5
  shuffle: True
  random_state: ${train.random_seed}

stratify: "/home/sangheon/Desktop/PansoriModeChangeDetection/data/Stratify/stratify.csv"


# Directory paths
dir:
  save_dir: "weights/segment"