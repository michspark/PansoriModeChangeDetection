<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pansori Ensemble Mode Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px;
    min-width: 180px;
    background: #1a1d27;
    border-right: 1px solid #2a2d3a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid #2a2d3a;
    flex-shrink: 0;
  }
  #sidebar-header h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 4px;
  }
  #sidebar-header p { font-size: 11px; color: #555; }
  #song-list { overflow-y: auto; flex: 1; }
  .song-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid #22253a;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .15s;
  }
  .song-item:hover { background: #23273a; }
  .song-item.active { background: #2d3250; border-left: 3px solid #56cf87; }
  .song-item .badge {
    font-size: 10px; padding: 2px 5px; border-radius: 3px;
    background: #1a3a1a; color: #4caf50; flex-shrink: 0;
  }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 16px 20px;
    gap: 12px;
  }

  #song-title {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    min-height: 24px;
  }

  /* ── Modality tabs ── */
  #modality-tabs {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .mod-tab {
    padding: 5px 14px;
    border-radius: 5px;
    border: 1px solid #333;
    background: #1e212e;
    color: #aaa;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .mod-tab:hover { background: #252a3a; color: #ddd; }
  .mod-tab.active { background: #2d3250; border-color: #56cf87; color: #56cf87; }

  /* ── Posteriorgrams ── */
  #posteriors-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .posterior-row {
    display: none;
  }
  .posterior-row.show { display: block; }
  .posterior-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #555;
    margin-bottom: 4px;
  }
  .canvas-wrap {
    position: relative;
    background: #1a1d27;
    border-radius: 6px;
    border: 1px solid #2a2d3a;
    overflow: hidden;
    cursor: crosshair;
  }
  .posterior-canvas {
    display: block;
    width: 100%;
    height: 120px;
  }
  #playhead {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: #ff4d4d;
    pointer-events: none;
    display: none;
  }
  #hover-line {
    position: absolute; top: 0; bottom: 0;
    width: 1px; background: rgba(255,255,255,0.3);
    pointer-events: none; display: none;
  }
  #time-tooltip {
    position: absolute; top: 4px;
    background: rgba(0,0,0,0.75); color: #fff;
    font-size: 11px; padding: 2px 6px;
    border-radius: 4px; pointer-events: none; display: none;
  }
  #y-labels {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 58px;
    display: flex; flex-direction: column;
    justify-content: space-around; padding: 4px 0;
    pointer-events: none;
  }
  .y-label { font-size: 9px; color: #777; text-align: center; line-height: 1; }

  /* ── Loading overlay (on ensemble canvas) ── */
  #loading-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    z-index: 10; border-radius: 6px;
    font-size: 13px; color: #aaa;
  }
  #loading-overlay.show { display: flex; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #333; border-top-color: #56cf87;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Confidence panel ── */
  #confidence-panel {
    background: #1a1d27;
    border-radius: 8px; border: 1px solid #2a2d3a;
    padding: 12px 16px; flex-shrink: 0;
  }
  #confidence-panel h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: #555; margin-bottom: 8px;
  }
  #confidence-bars { display: flex; flex-direction: column; gap: 6px; }
  .conf-row { display: flex; align-items: center; gap: 10px; }
  .conf-label { width: 64px; font-size: 11px; color: #ccc; flex-shrink: 0; }
  .conf-bar-bg {
    flex: 1; height: 10px; background: #252830;
    border-radius: 5px; overflow: hidden;
  }
  .conf-bar-fill { height: 100%; border-radius: 5px; transition: width .08s linear; }
  .conf-val { width: 40px; text-align: right; font-size: 11px; color: #aaa; font-variant-numeric: tabular-nums; }

  /* ── Audio panel ── */
  #audio-panel {
    background: #1a1d27; border-radius: 8px;
    border: 1px solid #2a2d3a; padding: 10px 16px;
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  #play-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: none; background: #56cf87; color: #fff;
    font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s;
  }
  #play-btn:hover { background: #76ef97; }
  #play-btn:disabled { background: #333; cursor: not-allowed; }
  #time-display { font-size: 12px; color: #aaa; min-width: 88px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  #seek-bar { flex: 1; height: 4px; cursor: pointer; accent-color: #56cf87; }
  #speed-select {
    background: #252830; color: #ccc; border: 1px solid #333;
    border-radius: 4px; padding: 3px 8px; font-size: 12px;
  }
  #clear-cache {
    padding: 4px 10px; border-radius: 4px; border: 1px solid #444;
    background: transparent; color: #777; font-size: 11px; cursor: pointer;
    transition: all .15s;
  }
  #clear-cache:hover { border-color: #f75b7c; color: #f75b7c; }

  /* ── Empty state ── */
  #empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #444; font-size: 14px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>Ensemble Viewer</h2>
    <p>Mel · PESTO · MIDI</p>
  </div>
  <div id="song-list"></div>
</div>

<div id="main">
  <div id="song-title">곡을 선택하세요</div>

  <div id="modality-tabs" style="display:none">
    <button class="mod-tab active" data-mod="ensemble">Ensemble</button>
    <button class="mod-tab" data-mod="mel">Mel</button>
    <button class="mod-tab" data-mod="pesto">PESTO</button>
    <button class="mod-tab" data-mod="midi">MIDI</button>
    <button class="mod-tab" data-mod="all">전체 보기</button>
  </div>

  <div id="posteriors-wrap" style="display:none">
    <!-- Ensemble -->
    <div class="posterior-row show" data-mod="ensemble">
      <div class="posterior-label">Ensemble (Mel + PESTO + MIDI)</div>
      <div class="canvas-wrap" id="wrap-ensemble">
        <div id="y-labels"></div>
        <canvas class="posterior-canvas" id="canvas-ensemble"></canvas>
        <div id="playhead"></div>
        <div id="hover-line"></div>
        <div id="time-tooltip"></div>
        <div id="loading-overlay"><div class="spinner"></div><span id="loading-msg">추론 중…</span></div>
      </div>
    </div>
    <!-- Mel -->
    <div class="posterior-row" data-mod="mel">
      <div class="posterior-label">Mel Spectrogram</div>
      <div class="canvas-wrap" id="wrap-mel">
        <canvas class="posterior-canvas" id="canvas-mel"></canvas>
      </div>
    </div>
    <!-- PESTO -->
    <div class="posterior-row" data-mod="pesto">
      <div class="posterior-label">PESTO Pitch Contour</div>
      <div class="canvas-wrap" id="wrap-pesto">
        <canvas class="posterior-canvas" id="canvas-pesto"></canvas>
      </div>
    </div>
    <!-- MIDI -->
    <div class="posterior-row" data-mod="midi">
      <div class="posterior-label">MIDI Piano Roll</div>
      <div class="canvas-wrap" id="wrap-midi">
        <canvas class="posterior-canvas" id="canvas-midi"></canvas>
      </div>
    </div>
  </div>

  <div id="confidence-panel" style="display:none">
    <h3 id="conf-title">Ensemble — 현재 프레임 Confidence</h3>
    <div id="confidence-bars"></div>
  </div>

  <div id="audio-panel" style="display:none">
    <button id="play-btn" disabled>▶</button>
    <span id="time-display">0:00 / 0:00</span>
    <input id="seek-bar" type="range" min="0" max="100" step="0.1" value="0"/>
    <select id="speed-select">
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
    <button id="clear-cache">캐시 삭제</button>
  </div>

  <div id="empty-state">← 좌측에서 곡을 선택하면 앙상블 추론 결과가 로드됩니다</div>
</div>

<audio id="audio-el" preload="auto"></audio>

<script>
const CLASS_NAMES  = ['Unknown', '우조', '계면조', '아니리', '창조'];
const CLASS_COLORS = ['#888888', '#5b7cf7', '#f7a35b', '#56cf87', '#f75b7c'];

let allData     = null;   // { ensemble, mel, pesto, midi } each Float32Array (T*5 flat)
let totalFrames = 0;
let FS          = 10;
let currentSong = null;
let currentMod  = 'ensemble';
let rafId       = null;
const BG        = [15, 17, 23];

// DOM
const songListEl     = document.getElementById('song-list');
const modalityTabs   = document.getElementById('modality-tabs');
const posteriorsWrap = document.getElementById('posteriors-wrap');
const confPanel      = document.getElementById('confidence-panel');
const confTitle      = document.getElementById('conf-title');
const confBars       = document.getElementById('confidence-bars');
const audioPanel     = document.getElementById('audio-panel');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingMsg     = document.getElementById('loading-msg');
const songTitle      = document.getElementById('song-title');
const emptyState     = document.getElementById('empty-state');
const audioEl        = document.getElementById('audio-el');
const playBtn        = document.getElementById('play-btn');
const seekBar        = document.getElementById('seek-bar');
const timeDisplay    = document.getElementById('time-display');
const speedSelect    = document.getElementById('speed-select');
const clearCacheBtn  = document.getElementById('clear-cache');
const playhead       = document.getElementById('playhead');
const hoverLine      = document.getElementById('hover-line');
const timeTooltip    = document.getElementById('time-tooltip');
const yLabels        = document.getElementById('y-labels');

const CANVASES = {
  ensemble: document.getElementById('canvas-ensemble'),
  mel:      document.getElementById('canvas-mel'),
  pesto:    document.getElementById('canvas-pesto'),
  midi:     document.getElementById('canvas-midi'),
};

// Y-axis labels
CLASS_NAMES.forEach(name => {
  const d = document.createElement('div');
  d.className = 'y-label';
  d.textContent = name;
  yLabels.appendChild(d);
});

// Confidence bars
CLASS_NAMES.forEach((name, i) => {
  const row = document.createElement('div');
  row.className = 'conf-row';
  row.innerHTML = `
    <span class="conf-label">${name}</span>
    <div class="conf-bar-bg"><div class="conf-bar-fill" id="bar-${i}" style="width:0%;background:${CLASS_COLORS[i]}"></div></div>
    <span class="conf-val" id="val-${i}">0.000</span>`;
  confBars.appendChild(row);
});

function updateConfBars(frame, modKey) {
  if (!allData || !allData[modKey]) return;
  const d = allData[modKey];
  const f = Math.min(Math.max(Math.floor(frame), 0), totalFrames - 1);
  CLASS_NAMES.forEach((_, c) => {
    const p = d[f * 5 + c];
    document.getElementById(`bar-${c}`).style.width = (p * 100).toFixed(1) + '%';
    document.getElementById(`val-${c}`).textContent  = p.toFixed(3);
  });
}

// ── Draw posteriorgram ─────────────────────────────────────────────────────────
function drawCanvas(modKey) {
  if (!allData || !allData[modKey]) return;
  const canvas = CANVASES[modKey];
  const W = canvas.width, H = canvas.height;
  if (W <= 0 || H <= 0) return;
  const T = totalFrames;
  const d = allData[modKey];
  const img = canvas.getContext('2d').createImageData(W, H);
  const pix = img.data;

  for (let px = 0; px < W; px++) {
    const frame = Math.floor((px / W) * T);
    const rowH  = H / 5;
    for (let c = 0; c < 5; c++) {
      const prob = d[frame * 5 + c];
      const r = parseInt(CLASS_COLORS[c].slice(1,3), 16);
      const g = parseInt(CLASS_COLORS[c].slice(3,5), 16);
      const b = parseInt(CLASS_COLORS[c].slice(5,7), 16);
      const y0 = Math.floor(c * rowH), y1 = Math.floor((c+1) * rowH);
      for (let py = y0; py < y1; py++) {
        const idx = (py * W + px) * 4;
        pix[idx]   = Math.round(BG[0] + (r - BG[0]) * prob);
        pix[idx+1] = Math.round(BG[1] + (g - BG[1]) * prob);
        pix[idx+2] = Math.round(BG[2] + (b - BG[2]) * prob);
        pix[idx+3] = 255;
      }
    }
    for (let c = 1; c < 5; c++) {
      const py = Math.floor(c * rowH);
      if (py < H) {
        const idx = (py * W + px) * 4;
        pix[idx] = pix[idx+1] = pix[idx+2] = 35; pix[idx+3] = 255;
      }
    }
  }
  canvas.getContext('2d').putImageData(img, 0, 0);
}

function resizeAndDraw() {
  ['ensemble','mel','pesto','midi'].forEach(k => {
    const c = CANVASES[k];
    const r = c.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      c.width  = Math.floor(r.width);
      c.height = Math.floor(r.height);
    }
    drawCanvas(k);
  });
}
new ResizeObserver(resizeAndDraw).observe(CANVASES.ensemble);

// ── Modality tab switching ────────────────────────────────────────────────────
function switchModality(mod) {
  currentMod = mod;
  document.querySelectorAll('.mod-tab').forEach(t => t.classList.toggle('active', t.dataset.mod === mod));

  document.querySelectorAll('.posterior-row').forEach(row => {
    const m = row.dataset.mod;
    if (mod === 'all') {
      row.classList.add('show');
    } else {
      row.classList.toggle('show', m === mod);
    }
  });

  const label = mod === 'all' ? 'Ensemble' : mod.charAt(0).toUpperCase() + mod.slice(1);
  confTitle.textContent = `${label} — 현재 프레임 Confidence`;
  if (allData) updateConfBars(currentFrame(), mod === 'all' ? 'ensemble' : mod);
  requestAnimationFrame(() => requestAnimationFrame(resizeAndDraw));
}

document.querySelectorAll('.mod-tab').forEach(tab => {
  tab.addEventListener('click', () => switchModality(tab.dataset.mod));
});

function currentFrame() {
  if (!audioEl.duration) return 0;
  return (audioEl.currentTime / audioEl.duration) * totalFrames;
}

// ── Playhead ──────────────────────────────────────────────────────────────────
function updatePlayhead() {
  if (!audioEl.duration || !allData) return;
  const prog = audioEl.currentTime / audioEl.duration;
  const w    = document.getElementById('wrap-ensemble').clientWidth;
  playhead.style.left    = (prog * w) + 'px';
  playhead.style.display = 'block';
  const mod = currentMod === 'all' ? 'ensemble' : currentMod;
  updateConfBars(prog * totalFrames, mod);
}

function rafLoop() { updatePlayhead(); rafId = requestAnimationFrame(rafLoop); }

// ── Song loading ──────────────────────────────────────────────────────────────
async function loadSong(name) {
  if (currentSong === name) return;
  currentSong = name;
  allData = null;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  audioEl.pause();
  playBtn.disabled = true;
  playhead.style.display = 'none';
  songTitle.textContent = name;

  emptyState.style.display    = 'none';
  modalityTabs.style.display  = 'flex';
  posteriorsWrap.style.display= 'flex';
  confPanel.style.display     = 'block';
  audioPanel.style.display    = 'flex';

  loadingOverlay.classList.add('show');
  loadingMsg.textContent = '추론 중… (처음 로드는 1-2분 소요)';

  try {
    const res = await fetch(`/api/inference/${encodeURIComponent(name)}`);
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();

    FS = json.fs;
    totalFrames = json.ensemble.length;
    allData = {};
    ['ensemble','mel','pesto','midi'].forEach(k => {
      allData[k] = new Float32Array(json[k].flat());
    });

    resizeAndDraw();
    loadingOverlay.classList.remove('show');

    audioEl.src = `/audio/${encodeURIComponent(name)}`;
    audioEl.load();
    playBtn.disabled = false;
    updateConfBars(0, 'ensemble');
    rafLoop();
  } catch(e) {
    loadingMsg.textContent = '오류: ' + e.message;
  }
}

// ── Song list ─────────────────────────────────────────────────────────────────
async function loadSongList() {
  const songs = await fetch('/api/songs').then(r => r.json());
  songListEl.innerHTML = '';
  songs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'song-item';
    const badge = s.cached ? '<span class="badge">캐시됨</span>' : '';
    el.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</span>${badge}`;
    el.title = s.name;
    el.addEventListener('click', () => {
      document.querySelectorAll('.song-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      loadSong(s.name);
    });
    songListEl.appendChild(el);
  });
}

// ── Audio controls ────────────────────────────────────────────────────────────
playBtn.addEventListener('click', () => {
  if (audioEl.paused) { audioEl.play(); playBtn.textContent = '⏸'; }
  else                { audioEl.pause(); playBtn.textContent = '▶'; }
});
audioEl.addEventListener('ended', () => playBtn.textContent = '▶');
audioEl.addEventListener('pause', () => playBtn.textContent = '▶');
audioEl.addEventListener('play',  () => playBtn.textContent = '⏸');
audioEl.addEventListener('timeupdate', () => {
  const cur = audioEl.currentTime, dur = audioEl.duration || 0;
  timeDisplay.textContent = `${fmt(cur)} / ${fmt(dur)}`;
  if (!isNaN(dur) && dur > 0) seekBar.value = (cur / dur * 100).toFixed(2);
});
audioEl.addEventListener('loadedmetadata', () => {
  seekBar.value = 0;
  timeDisplay.textContent = `0:00 / ${fmt(audioEl.duration)}`;
});
seekBar.addEventListener('input', () => {
  if (!isNaN(audioEl.duration)) audioEl.currentTime = audioEl.duration * seekBar.value / 100;
});
speedSelect.addEventListener('change', () => { audioEl.playbackRate = parseFloat(speedSelect.value); });

clearCacheBtn.addEventListener('click', async () => {
  if (!currentSong) return;
  await fetch(`/api/cache/${encodeURIComponent(currentSong)}`, { method: 'DELETE' });
  const prev = currentSong;
  currentSong = null;
  allData = null;
  await loadSong(prev);
  loadSongList();
});

// ── Canvas interaction ────────────────────────────────────────────────────────
const ensWrap = document.getElementById('wrap-ensemble');
ensWrap.addEventListener('click', e => {
  if (!allData || !audioEl.duration) return;
  const r = ensWrap.getBoundingClientRect();
  audioEl.currentTime = audioEl.duration * (e.clientX - r.left) / r.width;
});
ensWrap.addEventListener('mousemove', e => {
  if (!allData) return;
  const r    = ensWrap.getBoundingClientRect();
  const relX = e.clientX - r.left;
  const frame= Math.floor((relX / r.width) * totalFrames);
  hoverLine.style.left = relX + 'px'; hoverLine.style.display = 'block';
  const tx = Math.min(relX + 6, r.width - 80);
  timeTooltip.style.left = tx + 'px'; timeTooltip.style.display = 'block';
  timeTooltip.textContent = `${(frame / FS).toFixed(1)}s  [${frame}]`;
  const mod = currentMod === 'all' ? 'ensemble' : currentMod;
  updateConfBars(frame, mod);
});
ensWrap.addEventListener('mouseleave', () => {
  hoverLine.style.display = timeTooltip.style.display = 'none';
});

function fmt(s) {
  if (isNaN(s) || !isFinite(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

loadSongList();
</script>
</body>
</html>
