hydra:
  run:
    dir: .

# Data sources
data:
  data_dir: "/home/sangheon/Desktop/Pansori_Data/Audio_pesto_output"
  label_dir: "/home/sangheon/Desktop/PansoriModeChangeDetection/data/Label"

# Dataset configuration
dataset:
  name: "PitchFrameDataset"
  params:
    num_classes: 5
    frame_rate: 20
    window: 30
    threshold: 0.0
    aug: True

model:
  name: "Conv1DGRU"
  params:
    num_layers: 3
    in_channels: 2

    last_hidden_dim: 128
    use_gradual_size: False

    kernel_size: 3
    pool_size: False
    dilation: 1
    cnn_dropout: 0

    num_gru: 3
    hidden_dim: 128
    dropout: 0.0

    num_frames : ${dataset.params.window}*${dataset.params.frame_rate}
    num_classes: ${dataset.params.num_classes}

# Loss params
# If alpha=1 gamma=0: FocalLoss -> CrossEntropyLoss
loss:
  name: FocalLoss
  params:
    alpha: 1
    gamma: 0.0
    ignore_index: 0

# Training parameters
train:
  trainer: "FrameTrainer"
  lr: 5e-4
  batch_size: 32
  num_iterations: 5000
  eval_interval: 200
  save_interval: 1000
  random_seed: 42
  selection: SongStratified   # SongStratified | SharedFold | KFold | Artist | RandomSplit | Version
  shared_fold_dir:
  song_stratified_dir: "/home/sangheon/Desktop/Pansori_Data/song_stratified"
  version_split_dir: "/home/sangheon/Desktop/Pansori_Data/pansori_version_split"
  fold_dir: "/home/sangheon/Desktop/Pansori_Data/pansori_stratified_folds"  # shared 10-fold split files
  k_folds: 10
  target_folds: null  # e.g. [1] or [1,2,3] to run only specific folds; null = run all

# Cross-validation parameters
kfold:
  n_splits: 5
  shuffle: True
  random_state: ${train.random_seed}

stratify: "/home/sangheon/Desktop/PansoriModeChangeDetection/data/Stratify/stratify.csv"

filter:
  sigma: 5

# Directory paths
dir:
  save_dir: "weights/frame"