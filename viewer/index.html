<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pansori Mode Detection Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 270px;
    min-width: 200px;
    background: #1a1d27;
    border-right: 1px solid #2a2d3a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid #2a2d3a;
    flex-shrink: 0;
  }
  #sidebar-header h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 8px;
  }
  #fold-select-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #fold-select-wrap label {
    font-size: 12px;
    color: #888;
    flex-shrink: 0;
  }
  #fold-select {
    background: #252830;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 12px;
    flex: 1;
  }
  #song-list {
    overflow-y: auto;
    flex: 1;
  }
  .song-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid #22253a;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .15s;
  }
  .song-item:hover { background: #23273a; }
  .song-item.active { background: #2d3250; border-left: 3px solid #56cf87; }
  .song-item .badge {
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 3px;
    background: #1a3a1a;
    color: #4caf50;
    flex-shrink: 0;
  }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 20px;
    gap: 16px;
  }

  #song-title {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    min-height: 26px;
  }

  /* ── Posteriorgram ── */
  #canvas-wrap {
    position: relative;
    background: #1a1d27;
    border-radius: 8px;
    border: 1px solid #2a2d3a;
    overflow: hidden;
    flex-shrink: 0;
    cursor: crosshair;
  }
  #posterior-canvas {
    display: block;
    width: 100%;
    height: 150px;
  }
  #playhead {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: #ff4d4d;
    pointer-events: none;
    display: none;
  }
  #hover-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(255,255,255,0.3);
    pointer-events: none;
    display: none;
  }
  #time-tooltip {
    position: absolute;
    top: 4px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
    display: none;
  }

  /* Y-axis labels */
  #y-labels {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 4px 0;
    pointer-events: none;
  }
  .y-label {
    font-size: 10px;
    color: #aaa;
    text-align: center;
    line-height: 1;
  }

  /* ── Confidence bars ── */
  #confidence-panel {
    background: #1a1d27;
    border-radius: 8px;
    border: 1px solid #2a2d3a;
    padding: 14px 18px;
    flex-shrink: 0;
  }
  #confidence-panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
    margin-bottom: 10px;
  }
  #confidence-bars {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .conf-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .conf-label {
    width: 70px;
    font-size: 12px;
    color: #ccc;
    flex-shrink: 0;
  }
  .conf-bar-bg {
    flex: 1;
    height: 12px;
    background: #252830;
    border-radius: 6px;
    overflow: hidden;
  }
  .conf-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width .08s linear;
  }
  .conf-val {
    width: 42px;
    text-align: right;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: #aaa;
  }

  /* ── Audio controls ── */
  #audio-panel {
    background: #1a1d27;
    border-radius: 8px;
    border: 1px solid #2a2d3a;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #play-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: #56cf87;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  #play-btn:hover { background: #76ef97; }
  #play-btn:disabled { background: #333; cursor: not-allowed; }
  #time-display {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: #aaa;
    min-width: 90px;
    flex-shrink: 0;
  }
  #seek-bar {
    flex: 1;
    height: 4px;
    cursor: pointer;
    accent-color: #56cf87;
  }
  #speed-select {
    background: #252830;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }

  /* ── Loading overlay ── */
  #loading-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
    border-radius: 8px;
    font-size: 14px;
    color: #aaa;
  }
  #loading-overlay.show { display: flex; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #333;
    border-top-color: #56cf87;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty state ── */
  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 15px;
  }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Mode Detection Viewer</h2>
    <div id="fold-select-wrap">
      <label>Fold</label>
      <select id="fold-select"></select>
    </div>
  </div>
  <div id="song-list"></div>
</div>

<!-- Main content -->
<div id="main">
  <div id="song-title">곡을 선택하세요</div>

  <div id="canvas-wrap" style="display:none">
    <div id="y-labels"></div>
    <canvas id="posterior-canvas"></canvas>
    <div id="playhead"></div>
    <div id="hover-line"></div>
    <div id="time-tooltip"></div>
    <div id="loading-overlay"><div class="spinner"></div><span id="loading-msg">추론 중…</span></div>
  </div>

  <div id="confidence-panel" style="display:none">
    <h3>현재 프레임 Confidence</h3>
    <div id="confidence-bars"></div>
  </div>

  <div id="audio-panel" style="display:none">
    <button id="play-btn" disabled>▶</button>
    <span id="time-display">0:00 / 0:00</span>
    <input id="seek-bar" type="range" min="0" max="100" step="0.1" value="0"/>
    <select id="speed-select">
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
  </div>

  <div id="empty-state">← 좌측에서 곡을 선택하면 추론 결과와 오디오가 로드됩니다</div>
</div>

<audio id="audio-el" preload="auto"></audio>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const CLASS_NAMES  = ['Unknown', '우조', '계면조', '아니리', '창조'];
const CLASS_COLORS = ['#888888', '#5b7cf7', '#f7a35b', '#56cf87', '#f75b7c'];
let FS = 31.25;   // updated from server response

// ── State ──────────────────────────────────────────────────────────────────
let probsData   = null;   // Float32Array flat [T * 5]
let totalFrames = 0;
let currentSong = null;
let currentFold = null;
let rafId       = null;
let availFolds  = [];

// ── DOM refs ──────────────────────────────────────────────────────────────
const songListEl     = document.getElementById('song-list');
const foldSelect     = document.getElementById('fold-select');
const canvasWrap     = document.getElementById('canvas-wrap');
const canvas         = document.getElementById('posterior-canvas');
const ctx            = canvas.getContext('2d');
const playhead       = document.getElementById('playhead');
const hoverLine      = document.getElementById('hover-line');
const timeTooltip    = document.getElementById('time-tooltip');
const confPanel      = document.getElementById('confidence-panel');
const confBars       = document.getElementById('confidence-bars');
const audioPanel     = document.getElementById('audio-panel');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingMsg     = document.getElementById('loading-msg');
const songTitle      = document.getElementById('song-title');
const emptyState     = document.getElementById('empty-state');
const audioEl        = document.getElementById('audio-el');
const playBtn        = document.getElementById('play-btn');
const seekBar        = document.getElementById('seek-bar');
const timeDisplay    = document.getElementById('time-display');
const speedSelect    = document.getElementById('speed-select');
const yLabels        = document.getElementById('y-labels');

// ── Build confidence bar UI ────────────────────────────────────────────────
CLASS_NAMES.forEach((name, i) => {
  const row = document.createElement('div');
  row.className = 'conf-row';
  row.innerHTML = `
    <span class="conf-label">${name}</span>
    <div class="conf-bar-bg">
      <div class="conf-bar-fill" id="bar-${i}"
           style="width:0%;background:${CLASS_COLORS[i]}"></div>
    </div>
    <span class="conf-val" id="val-${i}">0.000</span>`;
  confBars.appendChild(row);
});

function updateConfBars(frame) {
  if (!probsData) return;
  const nC = CLASS_NAMES.length;
  const f  = Math.min(Math.max(Math.floor(frame), 0), totalFrames - 1);
  for (let c = 0; c < nC; c++) {
    const p = probsData[f * nC + c];
    document.getElementById(`bar-${c}`).style.width = (p * 100).toFixed(1) + '%';
    document.getElementById(`val-${c}`).textContent  = p.toFixed(3);
  }
}

// ── Y-axis labels ──────────────────────────────────────────────────────────
function buildYLabels() {
  yLabels.innerHTML = '';
  CLASS_NAMES.forEach(name => {
    const d = document.createElement('div');
    d.className = 'y-label';
    d.textContent = name;
    yLabels.appendChild(d);
  });
}
buildYLabels();

// ── Draw posteriorgram ─────────────────────────────────────────────────────
function drawPosteriorgram() {
  if (!probsData) return;
  const W  = canvas.width;
  const H  = canvas.height;
  const T  = totalFrames;
  const nC = CLASS_NAMES.length;

  const imgData = ctx.createImageData(W, H);
  const data    = imgData.data;

  for (let px = 0; px < W; px++) {
    const frame = Math.floor((px / W) * T);
    const rowH  = H / nC;

    for (let c = 0; c < nC; c++) {
      const prob = probsData[frame * nC + c];
      const yStart = Math.floor(c * rowH);
      const yEnd   = Math.floor((c + 1) * rowH);

      const r = parseInt(CLASS_COLORS[c].slice(1, 3), 16);
      const g = parseInt(CLASS_COLORS[c].slice(3, 5), 16);
      const b = parseInt(CLASS_COLORS[c].slice(5, 7), 16);

      for (let py = yStart; py < yEnd; py++) {
        const idx = (py * W + px) * 4;
        data[idx]     = Math.round(26 + (r - 26) * prob);
        data[idx + 1] = Math.round(29 + (g - 29) * prob);
        data[idx + 2] = Math.round(39 + (b - 39) * prob);
        data[idx + 3] = 255;
      }
    }

    // Separator lines
    for (let c = 1; c < nC; c++) {
      const py = Math.floor(c * rowH);
      if (py < H) {
        const idx = (py * W + px) * 4;
        data[idx] = data[idx + 1] = data[idx + 2] = 40;
        data[idx + 3] = 255;
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width  = Math.floor(rect.width);
  canvas.height = Math.floor(rect.height);
  drawPosteriorgram();
}
new ResizeObserver(resizeCanvas).observe(canvas);

// ── Audio playhead ─────────────────────────────────────────────────────────
function updatePlayhead() {
  if (!audioEl.duration || !probsData) return;
  const progress = audioEl.currentTime / audioEl.duration;
  const wrapW    = canvasWrap.clientWidth;
  playhead.style.left    = (progress * wrapW) + 'px';
  playhead.style.display = 'block';
  updateConfBars(progress * totalFrames);
}

function rafLoop() {
  updatePlayhead();
  rafId = requestAnimationFrame(rafLoop);
}

// ── Song loading ──────────────────────────────────────────────────────────
async function loadSong(name) {
  const fold = parseInt(foldSelect.value);
  const key  = name + '__fold' + fold;
  if (currentSong === name && currentFold === fold) return;
  currentSong = name;
  currentFold = fold;

  probsData = null;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  audioEl.pause();
  playBtn.disabled = true;
  playhead.style.display = 'none';
  songTitle.textContent  = `${name}  (fold ${fold})`;

  emptyState.style.display = 'none';
  canvasWrap.style.display  = 'block';
  confPanel.style.display   = 'block';
  audioPanel.style.display  = 'flex';

  loadingOverlay.classList.add('show');
  loadingMsg.textContent = '추론 중… (첫 로드는 1-2분 걸릴 수 있습니다)';

  try {
    const res  = await fetch(`/api/inference/${encodeURIComponent(name)}?fold=${fold}`);
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();

    FS          = json.fs;
    totalFrames = json.probs.length;
    probsData   = new Float32Array(json.probs.flat());

    resizeCanvas();
    loadingOverlay.classList.remove('show');

    audioEl.src = `/audio/${encodeURIComponent(name)}`;
    audioEl.load();
    playBtn.disabled = false;

    updateConfBars(0);
    rafLoop();
  } catch (e) {
    loadingMsg.textContent = '오류: ' + e.message;
  }
}

// ── Song list ─────────────────────────────────────────────────────────────
async function loadSongList() {
  const songs = await fetch('/api/songs').then(r => r.json());
  songListEl.innerHTML = '';
  songs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'song-item';
    const badge = s.cached ? '<span class="badge">캐시됨</span>' : '';
    el.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</span>${badge}`;
    el.title = s.name;
    el.addEventListener('click', () => {
      document.querySelectorAll('.song-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      loadSong(s.name);
    });
    songListEl.appendChild(el);
  });
}

// ── Fold selector ─────────────────────────────────────────────────────────
async function loadFolds() {
  availFolds = await fetch('/api/folds').then(r => r.json());
  foldSelect.innerHTML = '';
  availFolds.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = `Fold ${f}`;
    if (f === 7) opt.selected = true;
    foldSelect.appendChild(opt);
  });
}

foldSelect.addEventListener('change', () => {
  // Re-run inference with new fold if a song is selected
  if (currentSong) {
    currentFold = null; // force reload
    loadSong(currentSong);
  }
});

// ── Audio controls ────────────────────────────────────────────────────────
playBtn.addEventListener('click', () => {
  if (audioEl.paused) { audioEl.play(); playBtn.textContent = '⏸'; }
  else                { audioEl.pause(); playBtn.textContent = '▶'; }
});

audioEl.addEventListener('ended',  () => { playBtn.textContent = '▶'; });
audioEl.addEventListener('pause',  () => { playBtn.textContent = '▶'; });
audioEl.addEventListener('play',   () => { playBtn.textContent = '⏸'; });

audioEl.addEventListener('timeupdate', () => {
  const cur = audioEl.currentTime, dur = audioEl.duration || 0;
  timeDisplay.textContent = `${fmt(cur)} / ${fmt(dur)}`;
  if (!isNaN(dur) && dur > 0) seekBar.value = (cur / dur * 100).toFixed(2);
});

audioEl.addEventListener('loadedmetadata', () => {
  seekBar.value = 0;
  timeDisplay.textContent = `0:00 / ${fmt(audioEl.duration)}`;
});

seekBar.addEventListener('input', () => {
  if (!isNaN(audioEl.duration))
    audioEl.currentTime = audioEl.duration * seekBar.value / 100;
});

speedSelect.addEventListener('change', () => {
  audioEl.playbackRate = parseFloat(speedSelect.value);
});

function fmt(s) {
  if (isNaN(s) || !isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// ── Click canvas to seek ───────────────────────────────────────────────────
canvasWrap.addEventListener('click', e => {
  if (!probsData || !audioEl.duration) return;
  const rect     = canvasWrap.getBoundingClientRect();
  const progress = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = audioEl.duration * progress;
});

// ── Hover line + tooltip ───────────────────────────────────────────────────
canvasWrap.addEventListener('mousemove', e => {
  if (!probsData) return;
  const rect   = canvasWrap.getBoundingClientRect();
  const relX   = e.clientX - rect.left;
  const frame  = Math.floor((relX / rect.width) * totalFrames);
  const timeSec = frame / FS;

  hoverLine.style.left    = relX + 'px';
  hoverLine.style.display = 'block';

  const tooltipX = Math.min(relX + 6, rect.width - 80);
  timeTooltip.style.left    = tooltipX + 'px';
  timeTooltip.style.display = 'block';
  timeTooltip.textContent   = `${timeSec.toFixed(1)}s  [${frame}]`;

  updateConfBars(frame);
});

canvasWrap.addEventListener('mouseleave', () => {
  hoverLine.style.display   = 'none';
  timeTooltip.style.display = 'none';
});

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  await loadFolds();
  await loadSongList();
})();
</script>
</body>
</html>
